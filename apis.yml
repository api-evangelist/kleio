x-coverage:
  state: gated
  reason: sales-gate
  detail: 'Kleio runs a real OAuth-protected platform API at api.kleio.ai — its Google Cloud API Gateway
    serves RFC 8414 authorization-server metadata naming an Auth0 issuer and a defined dynamic client
    registration route — but publishes no developer portal, API reference, OpenAPI or auth guide
    anywhere, and kleio.ai/pricing and kleio.ai/docs both 404, so the only route to the API is the
    "Request a Demo" form at kleio.ai/contact.'
