summary: 'Kleio markets MCP as a first-class deployment surface but publishes no endpoint, no tool list,
  no input schemas and no connection instructions. Its own llms.txt lists "Integrations: ... chat
  surfaces, ChatGPT via MCP, agent-to-agent (A2A) protocols" and its product page claims "native
  integration with AI search platforms (ChatGPT, Google AI, Claude, Gemini) via MCP/UCP". The
  MCP-and-A2A article states only that "the A2A layer exposes this knowledge via MCP-compatible
  endpoints to external AI platforms" and names no URL. This artifact records the claim and the probe
  that failed to substantiate it. No tool list is derived, because there is no OpenAPI to derive one
  from and inventing tools for a server nobody can reach would fabricate an agent surface.'
