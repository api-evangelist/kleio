aid: kleio
name: Kleio
description: 'Kleio is a Paris-headquartered agentic commerce platform for complex, high-value enterprise
  sales, founded in 2024 by Adrien Mathieu, Philippe Wellens and Louis Poirier and backed by a EUR 3M
  seed round. The platform pairs a domain-specific Knowledge Engine — a continuously updated representation
  of a company''s catalog, pricing, business rules and ontologies — with a stack of orchestrated AI agents
  tuned for each stage of the sales funnel: discovery agents for intent qualification, product-guidance
  agents that reason over the catalog, quoting agents wired to configurators and pricing, and a Live Sales
  Copilot that augments human advisors in real time. Kleio deploys across web widgets, advisor desktops
  and third-party AI surfaces such as ChatGPT and Gemini via MCP/UCP integrations, with CRM and catalog
  write-back to Salesforce, HubSpot and custom systems. Named customers include Selectour, Havas Voyages,
  Showroomprive, Altarea Cogedim, Orpi and Emil Frey, across travel, real estate, automotive, wholesale,
  insurance, manufacturing and energy. Kleio publishes no public developer portal, API reference or
  OpenAPI: the platform API at api.kleio.ai is an OAuth-protected Google Cloud API Gateway reachable only
  to customers, and access begins with a sales conversation.'
