apis:
- aid: kleio-platform
  name: Kleio Platform API
  description: 'The Kleio platform API, served from api.kleio.ai behind a Google Cloud API Gateway and
    protected by OAuth 2.0 authorization-code + PKCE against an Auth0 tenant at auth.kleio.ai. Kleio
    publishes no public API reference or OpenAPI definition; the surface was established by probe — the
    gateway advertises RFC 8414 authorization-server metadata at
    https://api.kleio.ai/.well-known/oauth-authorization-server (HTTP 200) which names a dynamic client
    registration endpoint at https://api.kleio.ai/api/oauth/register (HTTP 405 to GET, confirming the
    route is defined). Every other probed path returns the gateway''s "The current request is not defined
    by this API" 404. Operations, schemas and scopes are not publicly documented.'
  humanURL: https://www.kleio.ai/products
  baseURL: https://api.kleio.ai
  tags:
  - Agentic Commerce
  - AI Agents
  - OAuth
