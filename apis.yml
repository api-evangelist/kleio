x-pointer-omissions:
  note: 'Pointers deliberately NOT emitted, recorded so a later pass does not re-litigate them. Each was
    considered and rejected because the check asserts something Kleio does not publish.'
  omitted:
  - type: MCPServer
    reason: 'Kleio markets MCP/UCP integration in its own llms.txt and product page but publishes no
      endpoint; tools/list POSTs to every plausible path return the gateway 404. See mcp/kleio-mcp.yml
      (deployment.mode: none). The search-engine result app.getkleio.com/api/mcp belongs to a
      different company that shares the name.'
  - type: AgentCard
    reason: '/.well-known/agent-card.json and /.well-known/agent.json return 404 on every Kleio host.
      Search-only artifact; nothing written.'
  - type: StatusPage
    reason: 'status.kleio.ai has a real DNS record but returns a Cloudflare bot challenge (403) and
      could not be read. kleio.statuspage.io is a soft-404 redirecting to Atlassian marketing.'
  - type: Deprecation
    reason: No deprecation or versioning policy published.
  - type: SDKs
    reason: Zero first-party client libraries in any registry; the GitHub org has no public repos.
  - type: Compliance
    reason: 'The certifications in kleio.ai/security-policy (SOC 2, ISO 27001/27017/27018) are held by
      sub-processors — GCP, Redis Cloud, CockroachDB — not by Kleio.'
  - type: Pricing
    reason: No pricing page exists; kleio.ai/pricing 404s and the sitemap has no pricing URL.
  - type: DeveloperPortal
    reason: 'Kleio has no developer portal. kleio.ai/products and /agentic-discovery-engine are
      marketing pages; pointing a portal check at them would credit 4 pts for a surface that does not
      exist.'
  - type: Documentation
    reason: 'No API documentation of any kind. kleio.ai/docs and /developers both 404 and no docs
      subdomain resolves.'
  - type: APIReference
    reason: No API reference published.
  - type: GettingStarted
    reason: No quickstart or getting-started guide published.
  - type: SignUp
    reason: 'No self-service registration. kleio.ai/login 404s; kleio.ai/contact is a "Request a Demo"
      form, which is a sales gate rather than a sign-up.'
  - type: Postman
    reason: No public Postman collection or workspace found.
  - type: Roadmap
    reason: No public roadmap.
  - type: ChangeLog
    reason: 'No changelog or release notes. kleio.ai/changelog 404s and the sitemap lists none.'
  - type: AsyncAPI/Webhooks
    reason: No event, streaming or webhook surface is documented publicly.
  - type: AgentSkill
    reason: 'No OpenAPI exists to ground skills in, and skills must be grounded in real operationIds.'
  - type: Idempotency
    reason: No idempotency contract is documented or observable.
  - type: OpenAPI
    reason: 'No specification found after probing every spec path on www.kleio.ai, api.kleio.ai, the
      Cloud Run backend, and the non-resolving docs/developer/app subdomains.'
